name: Deploy staging

# Merge na main = migrações no banah-staging + publicação do staging.
# Só roda depois que o CI da main passou.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrações no staging
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Publicar no Vercel (ambiente staging)
        id: deploy
        run: |
          npx vercel@latest pull --yes --environment=staging --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest build --target=staging --token=${{ secrets.VERCEL_TOKEN }}
          url=$(npx vercel@latest deploy --prebuilt --target=staging --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Conferir saúde
        run: |
          sleep 10
          curl -fsS "${{ vars.APP_URL }}/api/health" || (echo "::error::Health falhou no staging" && exit 1)
