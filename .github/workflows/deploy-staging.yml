name: Deploy staging

# Merge na main = migrações no banah-staging + publicação do staging.
# Só roda depois que o CI da main passou.
on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-staging
  cancel-in-progress: false

jobs:
  staging:
    # Liga quando a variável DEPLOY_ATIVO=true for criada no GitHub (Settings → Variables).
    if: ${{ vars.DEPLOY_ATIVO == 'true' && (github.event_name == 'workflow_dispatch' || github.event.workflow_run.conclusion == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile

      - name: Migrações no staging
        run: |
          if [ -z "$DATABASE_URL" ]; then echo "::error::Segredo DATABASE_URL_DIRECT vazio ou fora do environment staging"; exit 1; fi
          set +e
          pnpm db:migrate > migrar.log 2>&1
          codigo=$?
          set -e
          # Mostra o resultado sem expor senha ou endereço do banco.
          sed -E 's#postgres(ql)?://[^ "]+#[url-omitida]#g' migrar.log | tail -40
          if [ $codigo -ne 0 ]; then
            resumo=$(sed -E 's#postgres(ql)?://[^ "]+#[url-omitida]#g' migrar.log | grep -v "^\s*$" | tail -25 | tr '\n' ' ')
            echo "::error::Migração falhou: ${resumo}"
            exit $codigo
          fi
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL_DIRECT }}

      - name: Publicar no Vercel (ambiente staging)
        id: deploy
        run: |
          npx vercel@latest pull --yes --environment=staging --token=${{ secrets.VERCEL_TOKEN }}
          npx vercel@latest build --target=staging --token=${{ secrets.VERCEL_TOKEN }}
          url=$(npx vercel@latest deploy --prebuilt --target=staging --token=${{ secrets.VERCEL_TOKEN }})
          echo "url=$url" >> "$GITHUB_OUTPUT"

      - name: Conferir saúde
        run: |
          sleep 10
          curl -fsS "${{ vars.APP_URL }}/api/health" || (echo "::error::Health falhou no staging" && exit 1)
