name: Cron staging

# O Vercel Cron só dispara em produção. No staging, o GitHub chama o executor.
on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

jobs:
  tick:
    if: ${{ vars.DEPLOY_ATIVO == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 6
    environment: staging
    steps:
      - name: Chamar /api/cron/tick
        run: |
          codigo=$(curl -sS --max-time 300 -o resposta.txt -w '%{http_code}' \
            -H "Authorization: Bearer $CRON_SECRET" "${{ vars.APP_URL }}/api/cron/tick" || echo 000)
          echo "::notice::tick ${codigo}: $(head -c 500 resposta.txt 2>/dev/null)"
          [ "$codigo" = "200" ] || { echo "::error::tick respondeu ${codigo}"; exit 1; }
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
