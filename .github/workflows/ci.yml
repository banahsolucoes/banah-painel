name: CI

# Roda em todo Pull Request e em todo push na main.
# Qualquer falha aqui bloqueia o merge.
on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/postgres
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Lint
        run: pnpm lint
      - name: Tipos
        run: pnpm typecheck
      - name: Migrações num banco descartável
        run: pnpm db:migrate
      - name: Testes (inclui fila contra o banco)
        run: pnpm test
      - name: Migração não gerada?
        run: |
          pnpm db:generate
          git diff --exit-code packages/db/drizzle || (echo "::error::O schema mudou sem migração. Rode pnpm db:generate e envie o arquivo." && exit 1)
      - name: Build
        run: pnpm build
        env:
          APP_ENV: local
          NEXT_PUBLIC_SUPABASE_URL: http://localhost:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci
